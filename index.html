<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="Live Citi Bike availability near my favorite places.">
  <title>Josh's Bikes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1 class="sr-only">Josh's Bikes</h1>
  <div id="ptr" class="ptr" aria-live="polite">
    <span class="ptr-icon" aria-hidden="true"></span><span class="ptr-text">Pull to refresh</span>
  </div>

  <header class="bar">
    <div class="bar-in">
      <button type="button" id="locBtn" class="loc-btn" aria-expanded="false" aria-controls="locPanel">
        <svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span id="locLabel" class="loc-label">GPS…</span>
        <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <span id="updated" class="updated" aria-live="polite">Loading…</span>
      <button type="button" id="allBtn" class="all-btn">Expand all</button>
    </div>
    <p id="failLine" class="fail-line" role="status" hidden></p>
    <div id="locPanel" class="loc-panel" hidden>
      <div class="bar-in col">
        <p class="panel-title">Measure “near me” from</p>
        <div id="locChoices" class="chips"></div>
        <div class="search-wrap">
          <div class="search">
            <svg class="search-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="locInput" type="search" placeholder="Another address or place" aria-label="Set my location to an address or place" autocomplete="off" enterkeyhint="search">
          </div>
          <div id="locSuggest" class="suggest" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="search-wrap main-search">
      <div class="search">
        <svg class="search-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Search an address or place" aria-label="Search an address or place" autocomplete="off" enterkeyhint="search">
        <button type="button" id="qClear" class="clear-btn" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="suggest" class="suggest" hidden></div>
    </div>

    <div id="cards" class="cards"></div>

    <div class="foot">
      <button type="button" id="editBtn" class="text-btn">Edit favorites</button>
      <p class="legend" aria-hidden="true">
        <span class="lg"><span class="mini bikes c-good">7</span> bikes</span>
        <span class="lg"><span class="mini docks c-good">7</span> docks</span>
        <span class="lg">Hold a name to rename it</span>
      </p>
    </div>
  </main>

  <noscript><p class="fail-line">Josh's Bikes needs JavaScript.</p></noscript>
</body>
</html>
